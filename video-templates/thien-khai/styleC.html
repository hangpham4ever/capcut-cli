<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Be+Vietnam+Pro:wght@500;600;700;800;900&display=block&subset=vietnamese" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;overflow:hidden;position:relative;font-family:'Be Vietnam Pro';background:transparent}
#bgl{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#26326f 0%,#0d1438 45%,#04061a 100%)}
.stars{position:absolute;inset:0;background-image:
 radial-gradient(1.6px 1.6px at 12% 18%,#fff8,transparent),radial-gradient(1.2px 1.2px at 82% 12%,#fff9,transparent),
 radial-gradient(2px 2px at 70% 40%,#ffe9a8aa,transparent),radial-gradient(1.4px 1.4px at 25% 62%,#fff7,transparent),
 radial-gradient(1.8px 1.8px at 90% 70%,#fff8,transparent),radial-gradient(1.2px 1.2px at 8% 85%,#fff6,transparent),
 radial-gradient(1.5px 1.5px at 55% 92%,#ffe9a888,transparent),radial-gradient(1.3px 1.3px at 40% 8%,#fff8,transparent)}
.halo{position:absolute;left:50%;top:200px;width:1300px;height:1300px;transform:translate(-50%,-50%);
 background:repeating-conic-gradient(from 0deg,rgba(255,214,120,.08) 0 4deg,transparent 4deg 12deg);
 -webkit-mask:radial-gradient(circle,#000 0 20%,transparent 55%)}
.kick{position:absolute;top:72px;left:0;right:0;text-align:center;font:800 28px 'Be Vietnam Pro';letter-spacing:8px;color:#f3d27a}
.kick:before,.kick:after{content:"";display:inline-block;width:110px;height:2px;background:linear-gradient(90deg,transparent,#f3d27a);vertical-align:middle;margin:0 18px}
.kick:after{background:linear-gradient(90deg,#f3d27a,transparent)}
/* ---------- TITLE (animated layer) ---------- */
.title{position:absolute;top:112px;left:60px;right:60px;text-align:center;transform-origin:50% 60%}
.title .ln{display:inline-block;font:900 54px/1.12 'Playfair Display';text-transform:uppercase;white-space:nowrap}
.title .big{font-size:96px}
.gold{background-image:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%),linear-gradient(180deg,#fff6d0 0%,#f6d16b 45%,#c8902a 100%);
 background-size:320% 100%,100% 100%;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent}
.title .ln{filter:drop-shadow(0 3px 0 #3a2400) drop-shadow(0 0 var(--glow,16px) rgba(255,200,90,var(--ga,.5)))}
.lt{display:inline-block}
.spark{position:absolute;font:400 40px 'Be Vietnam Pro';color:#fff3c0;text-shadow:0 0 14px #ffd76a,0 0 30px #ffb52e}
/* ---------- rest ---------- */
.chip{position:absolute;top:312px;left:50%;transform:translateX(-50%);white-space:nowrap;border:2px solid #f3d27a;border-radius:40px;
 padding:6px 28px;font:700 32px 'Be Vietnam Pro';color:#fff;background:rgba(10,16,50,.75)}
.frame{position:absolute;left:80px;top:392px;width:920px;height:500px;border-radius:26px;overflow:hidden;
 border:5px solid #f3d27a;box-shadow:0 0 0 2px #7a5a10,0 0 44px rgba(255,200,90,.55)}
.card{position:absolute;left:80px;top:938px;width:920px;height:272px;border-radius:26px;transform-origin:50% 0;
 background:linear-gradient(160deg,rgba(40,52,120,.94),rgba(12,18,52,.96));border:3px solid #f3d27a;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 30px rgba(255,210,120,.12);
 display:flex;align-items:center;gap:28px;padding:0 50px 0 46px}
.num{position:absolute;top:-32px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#fff3c4,#e3a93a);color:#2a1a00;
 font:900 30px 'Be Vietnam Pro';padding:8px 28px;border-radius:30px;border:3px solid #fff;letter-spacing:2px;box-shadow:0 4px 12px rgba(0,0,0,.5);white-space:nowrap}
.ico{flex:0 0 156px;height:156px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:84px 'Noto Color Emoji';
 background:radial-gradient(circle,#3a4ba0,#141c50);border:3px solid #f3d27a;box-shadow:0 0 26px rgba(255,210,120,.55)}
.ct h2{font:900 46px/1.12 'Be Vietnam Pro';color:#fff;text-transform:uppercase}
.ct h2 b{color:#ffd76a}
.ct p{margin-top:12px;font:600 31px/1.3 'Be Vietnam Pro';color:#f6e3b0}
.dots{position:absolute;top:1232px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.dots i{width:16px;height:16px;border-radius:50%;background:#3b4680;border:2px solid #f3d27a66}
.dots i.on{background:#ffd76a;box-shadow:0 0 12px #ffd76a;width:44px;border-radius:10px}
.dots i.done{background:#c8a24a}
.sub{position:absolute;left:110px;right:110px;top:1262px;height:100px;display:flex;align-items:center;justify-content:center;text-align:center;
 font:800 40px/1.2 'Be Vietnam Pro';color:#fff;-webkit-text-stroke:6px #050820;paint-order:stroke fill}
</style></head><body>
<div id="bgl"><div class="stars"></div><div class="halo"></div></div>
<div class="kick">SƯ PHỤ GIẢNG</div>
<div class="title" id="title"><div class="ln gold" id="t1"></div><br><div class="ln big gold" id="t2"></div>
 <span class="spark" id="s1" style="left:-10px;top:70px">✦</span><span class="spark" id="s2" style="right:-6px;top:20px">✦</span><span class="spark" id="s3" style="right:60px;top:150px;font-size:28px">✦</span></div>
<div class="chip" id="chip"></div>
<div class="frame" id="frame"><img id="bg" style="width:100%;height:100%;object-fit:cover"></div>
<div class="card" id="card"><div class="num" id="num"></div><div class="ico" id="ico"></div><div class="ct"><h2 id="h"></h2><p id="d"></p></div></div>
<div class="dots" id="dots"></div>
<div class="sub" id="sub"></div>
<script>
const $=i=>document.getElementById(i);
window.CFG={kick:'SƯ PHỤ GIẢNG',t1:'Ý nghĩa ngày',t2:'Thập Bát Trăng Mười',chip:'🌕 18 tháng 10 âm lịch • Ngày của Mẹ',
P:[["🌍","Ngày của <b>Mẹ</b> – ngày của <b>Địa Cầu</b>","Ngày Phật Mẫu. Bên Mỹ gọi là Earth Day – Ngày Trái Đất"],
["👫","<b>Adam & Eva</b> đặt chân xuống trái đất","Những người đầu tiên từ cõi Trời xuống, 300 – 400 nghìn năm trước"],
["🐒","Con người <b>không</b> từ khỉ mà ra","Khỉ ngàn năm vẫn là khỉ – người từ cõi Quang Âm Thiên xuống đây"],
["📜","Lễ nào cũng có <b>tích</b>, có <b>thật</b>","Không phải tự đặt ra. Đạo Cao Đài thờ Thượng Đế cũng hiểu điều này"],
["✨","<b>12 người con</b> của Thượng Đế","Âu Châu, Do Thái thờ 12 người con – trùng với 12 anh em của Sư Phụ"]]};
const HOLE="M106 397H974A21 21 0 0 1 995 418V866A21 21 0 0 1 974 887H106A21 21 0 0 1 85 866V418A21 21 0 0 1 106 397Z";
function fitBig(){const el=$('t2');el.style.fontSize='96px';let f=96;while(el.getBoundingClientRect().width>830&&f>40){f-=2;el.style.fontSize=f+'px'}}
function setTitle(t){ // t = seconds since start
 const C=window.CFG,intro=1.2;
 for(const [id,txt,off] of [['t1',C.t1,0],['t2',C.t2,0.25]]){const el=$(id);
  if(t<intro){el.classList.remove('gold');el.innerHTML='';let i=0;
   for(const ch of txt){const sp=document.createElement('span');sp.className='lt gold';sp.textContent=ch===' '?' ':ch;
    const p=Math.min(1,Math.max(0,(t-off-i*0.035)/0.35)),e=1-Math.pow(1-p,3),ov=p<1?Math.sin(p*Math.PI)*0.25:0;
    sp.style.opacity=p;sp.style.transform=`translateY(${-70*(1-e)}px) scale(${1+0.6*(1-e)+ov})`;sp.style.backgroundSize='100% 100%,100% 100%';
    sp.style.backgroundImage='linear-gradient(180deg,#fff6d0 0%,#f6d16b 45%,#c8902a 100%)';el.appendChild(sp);i++;}}
  else {el.innerHTML='';el.textContent=txt;el.classList.add('gold');
   const ph=((t-intro)%2.6)/2.6;el.style.backgroundPosition=`${120-ph*140}% 0,0 0`;}
 }
 const tt=Math.max(0,t-1.2),br=Math.sin(tt*2*Math.PI/2.6);
 $('title').style.transform=`scale(${1+0.025*br})`;
 $('title').style.setProperty('--glow',(16+12*(br+1)/2)+'px');$('title').style.setProperty('--ga',(.45+.35*(br+1)/2).toFixed(2));
 [['s1',0],['s2',0.9],['s3',1.7]].forEach(([id,ph])=>{const v=(Math.sin((t+ph)*2*Math.PI/1.4)+1)/2;$(id).style.opacity=t<intro?0:v;$(id).style.transform=`scale(${0.5+0.8*v}) rotate(${v*45}deg)`});
}
window.render=function({k=1,sub='',t=1.2,p=1,part='review',bg=''}){
 const C=window.CFG;$('chip').textContent=C.chip;document.querySelector('.kick').textContent=C.kick;
 $('t1').textContent=C.t1;$('t2').textContent=C.t2;fitBig();setTitle(t);
 const [e,h,d]=C.P[k-1];$('num').textContent='Ý '+k+' / '+C.P.length;$('ico').textContent=e;$('h').innerHTML=h;$('d').textContent=d;
 const ee=1-Math.pow(1-p,3),ov=p<1?Math.sin(p*Math.PI)*0.06:0;
 $('card').style.opacity=Math.min(1,p*1.6);$('card').style.transform=`translateY(${50*(1-ee)}px) scale(${0.86+0.14*ee+ov})`;
 $('sub').textContent=sub;$('dots').innerHTML='';C.P.forEach((_,i)=>{const x=document.createElement('i');x.className=i+1<k?'done':i+1==k?'on':'';$('dots').appendChild(x)});
 const all=['bgl','title','chip','frame','card','dots','sub'];const show=s=>all.forEach(i=>$(i).style.visibility=s.includes(i)?'visible':'hidden');
 document.querySelector('.kick').style.visibility=part==='title'?'hidden':'visible';
 if(part==='title'){show(['title'])}
 else if(part==='base'){show(['bgl','chip','frame','card','dots','sub']);$('title').style.visibility='hidden';
  $('bg').style.display='none';const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1440'><path fill-rule='evenodd' d='M0 0H1080V1440H0Z ${HOLE}'/></svg>`;
  const u='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';$('bgl').style.webkitMaskImage=u;}
 else {show(all);$('bg').style.display='block';$('bg').src=bg;$('bgl').style.webkitMaskImage='none'}
};
</script></body></html>
