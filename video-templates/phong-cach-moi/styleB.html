<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@800;900&display=block&subset=vietnamese" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;overflow:hidden;background:#000;position:relative;font-family:'Be Vietnam Pro'}
#speaker{position:absolute;inset:0;width:1080px;height:1440px;object-fit:cover}
.shade{position:absolute;left:0;right:0;bottom:0;height:640px;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.ttl{position:absolute;left:140px;top:770px;background:#0b1d57;padding:8px 30px 10px;border-radius:6px;
 box-shadow:0 0 0 3px #3fb6ff,0 0 34px 10px rgba(41,168,255,.85)}
.ttl span.jit{font:400 64px/1.05 'Anton';color:#fff;letter-spacing:1px;white-space:nowrap}
.why{position:absolute;left:140px;top:878px;background:#e0101a;border:4px solid #fff;padding:2px 26px 6px;transform:rotate(-2deg);
 box-shadow:6px 6px 0 rgba(0,0,0,.6)}
.why span{font:400 66px/1.1 'Anton';color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill}
.row{position:absolute;left:130px;right:240px;display:flex;align-items:center;gap:22px}
.tag{flex:0 0 130px;text-align:center;font:400 76px/1 'Anton';color:#ffe600;-webkit-text-stroke:6px #000;paint-order:stroke fill;
 filter:drop-shadow(0 0 10px rgba(255,230,0,.9))}
.txt{font:900 38px/1.22 'Be Vietnam Pro';color:#fff;-webkit-text-stroke:7px #000;paint-order:stroke fill;position:relative}
.txt:after{content:"";position:absolute;right:-6px;bottom:-12px;width:110px;height:12px;background:#fff;border-radius:8px;transform:skewX(-35deg);box-shadow:2px 2px 0 #000}
</style></head><body>
<img id="speaker"><div class="shade"></div>
<div class="ttl"><span class="jit" id="t"></span></div>
<div class="why"><span id="w"></span></div>
<div class="row" style="top:990px"><div class="tag" id="k1"></div><div class="txt" id="x1"></div></div>
<div class="row" style="top:1160px"><div class="tag" id="k2"></div><div class="txt" id="x2"></div></div>
<script>
const p=new URLSearchParams(location.search),$=i=>document.getElementById(i);
$('speaker').src=p.get('bg')||'';$('t').textContent=p.get('t')||'';$('w').textContent=p.get('w')||'';
$('k1').textContent=p.get('k1')||'';$('x1').textContent=p.get('x1')||'';$('k2').textContent=p.get('k2')||'';$('x2').textContent=p.get('x2')||'';
</script><script src="jitter.js"></script></body></html>
