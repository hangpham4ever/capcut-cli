<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@700;800;900&display=block&subset=vietnamese" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;overflow:hidden;background:#000;position:relative;font-family:'Be Vietnam Pro'}
#speaker{position:absolute;left:0;top:0;width:1080px;height:560px;object-fit:cover}
.pill{position:absolute;top:68px;left:110px;background:#e0101a;color:#fff;white-space:nowrap;font:800 36px 'Be Vietnam Pro';
 padding:8px 34px 8px 12px;border-radius:60px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.yt{width:64px;height:64px;background:#fff;border-radius:50%;position:relative}
.yt:after{content:"";position:absolute;left:18px;top:20px;width:28px;height:24px;background:#e0101a;border-radius:6px}
.yt:before{content:"";position:absolute;left:28px;top:26px;border-left:12px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;z-index:2}
.ybox{position:absolute;left:130px;width:820px;top:520px;background:#ffe600;padding:14px 20px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.ybox div{white-space:nowrap;font:900 54px/1.25 'Be Vietnam Pro';color:#111;text-transform:uppercase;border-bottom:4px solid #111;display:inline-block;padding:0 6px 2px}
.ybox div+div{margin-top:4px}
.band{position:absolute;left:0;width:1080px;top:700px;height:170px;background:#000;display:flex;align-items:center;justify-content:center;gap:18px}
.q{font-size:100px;font-family:'Noto Color Emoji';filter:drop-shadow(0 0 4px #fff)}
.hook{font:400 118px/1 'Anton';color:#d4001a;-webkit-text-stroke:7px #fff;paint-order:stroke fill;filter:drop-shadow(0 0 5px #ffe600) drop-shadow(0 0 4px #ffe600);white-space:nowrap}
.panels{position:absolute;top:870px;left:0;width:1080px;height:570px;display:flex}
.panel{flex:1;position:relative;overflow:hidden;background:#123}
.panel img{width:100%;height:100%;object-fit:cover}
.panel .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:110px;font-family:'Noto Color Emoji';
 background:radial-gradient(circle at 50% 60%,#3b4a8a,#0b1230)}
.lbl{position:absolute;top:20px;background:#2b2fd0;color:#fff;font:700 38px/1.15 'Be Vietnam Pro';text-align:center;padding:8px 18px;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.panel:first-child .lbl{left:110px;right:20px}.panel:last-child .lbl{left:20px;right:110px}
</style></head><body>
<img id="speaker">
<div class="pill"><span class="yt"></span><span id="clip"></span></div>
<div class="ybox"><div id="l1"></div><br><div id="l2"></div></div>
<div class="band"><span class="q">⁉️</span><span class="hook jit" id="hook"></span><span class="q">⁉️</span></div>
<div class="panels"><div class="panel" id="p1"><div class="lbl" id="b1"></div></div><div class="panel" id="p2"><div class="lbl" id="b2"></div></div></div>
<script>
const p=new URLSearchParams(location.search),$=i=>document.getElementById(i);
$('speaker').src=p.get('bg')||'';$('clip').textContent=p.get('clip')||'';
$('l1').textContent=p.get('l1')||'';$('l2').textContent=p.get('l2')||'';$('hook').textContent=p.get('hook')||'';
for(const k of ['1','2']){const im=p.get('img'+k),art=p.get('art'+k),pn=$('p'+k);
 if(im){const i=document.createElement('img');i.src=im;pn.prepend(i)} else if(art){const d=document.createElement('div');d.className='art';d.textContent=art;pn.prepend(d)}
 $('b'+k).innerHTML=p.get('b'+k)||''}
for(const id of ['l1','l2']){const el=$(id);let f=54;while(el.getBoundingClientRect().width>770&&f>28){f-=2;el.style.fontSize=f+'px'}}
</script><script src="jitter.js"></script></body></html>
